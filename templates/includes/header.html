{% load static %}
<nav class="bg-stone-900 text-stone-100 sticky top-0 z-50 border-b border-amber-600/30">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">

    <!-- Mobile Hamburger Button -->
    <button id="mobile-menu-btn" class="md:hidden text-amber-400 focus:outline-none" aria-label="Open Navigation Menu">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>

    <!-- Brand Logo -->
    <a href="{% url 'core:home' %}" class="font-serif-luxury text-xl sm:text-2xl tracking-widest text-amber-400 font-bold">PANCHAKANYA</a>

    <!-- Desktop Navigation Links -->
    <div class="hidden md:flex space-x-8 text-sm uppercase tracking-wider">
      <a href="{% url 'core:home' %}" class="hover:text-amber-400 transition">Home</a>
      <a href="{% url 'products:category_overview' %}" class="hover:text-amber-400 transition">Categories</a>
      <a href="{% url 'products:list' %}" class="hover:text-amber-400 transition">Collections</a>
      <a href="#" class="hover:text-amber-400 transition">About</a>
    </div>

    <!-- Account & Cart Actions -->
    <div class="flex items-center space-x-4 sm:space-x-6 text-sm">
      {% if user.is_authenticated %}
        <div class="relative">
          <button id="user-menu-btn" class="flex items-center space-x-2 text-stone-300 hover:text-amber-400 focus:outline-none">
            <span class="font-medium hidden sm:inline">{{ user.username }}</span>
            <div class="w-8 h-8 rounded-full bg-amber-600 text-stone-900 flex items-center justify-center font-bold font-serif-luxury">
              {{ user.username|first|upper }}
            </div>
          </button>

          <!-- Account Dropdown -->
          <div id="user-dropdown" class="hidden absolute right-0 mt-2 w-48 bg-white text-stone-800 rounded-sm shadow-xl py-2 z-50 border border-stone-200">
            <a href="dashboard.html" class="block px-4 py-2 text-sm hover:bg-stone-100">Dashboard</a>
            <a href="{% url 'accounts:profile' %}" class="block px-4 py-2 text-sm hover:bg-stone-100">Profile</a>
            <a href="#" class="block px-4 py-2 text-sm hover:bg-stone-100">My Orders</a>
            <hr class="my-1 border-stone-200">
            <form method="post" action="{% url 'accounts:logout' %}">
    {% csrf_token %}
    <button
        type="submit"
        class="block w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-stone-100"
    >
        Logout
    </button>
</form>
          </div>
        </div>
      {% else %}
        <a href="{% url 'accounts:login' %}" class="hover:text-amber-400 font-medium">Login</a>
      {% endif %}

      <a href="#" class="bg-amber-600 text-stone-900 font-semibold px-3 py-1.5 sm:px-4 sm:py-2 rounded-sm hover:bg-amber-500 transition text-xs sm:text-sm">Cart (0)</a>
    </div>
  </div>

  <!-- Mobile Drawer Menu -->
  <div id="mobile-menu" class="closed fixed inset-0 bg-stone-900 z-50 p-6 md:hidden flex flex-col justify-between">
    <div>
      <div class="flex justify-between items-center mb-8 border-b border-stone-800 pb-4">
        <span class="font-serif-luxury text-amber-400 font-bold text-lg">PANCHAKANYA</span>
        <button id="close-menu-btn" class="text-stone-400 hover:text-white" aria-label="Close Navigation Menu">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="flex flex-col space-y-6 text-lg uppercase tracking-wider text-stone-200">
        <a href="{% url 'core:home' %}" class="hover:text-amber-400">Home</a>
        <a href="{% url 'products:category_overview' %}" class="hover:text-amber-400 transition">Categories</a>
        <a href="{% url 'products:list' %}#featured" class="hover:text-amber-400">Collections</a>
        <a href="#" class="hover:text-amber-400">About Us</a>
      </div>
    </div>
    {% if not user.is_authenticated %}
      <a href="{% url 'accounts:login' %}" class="w-full text-center bg-amber-600 text-stone-900 py-3 font-semibold uppercase rounded-sm">Sign In</a>
    {% endif %}
  </div>
</nav>
