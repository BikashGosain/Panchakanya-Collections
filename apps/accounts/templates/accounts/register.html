{% load socialaccount %}

<h2>Register</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Register</button>
</form>

<p>or</p>

<form method="post" action="{% provider_login_url 'google' %}">
    {% csrf_token %}
    <button type="submit">
        Continue with Google
    </button>
</form>

<p>
    Already have an account?
    <a href="{% url 'accounts:login' %}">
        Login
    </a>
</p>
