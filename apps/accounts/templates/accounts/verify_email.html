<h2>Verify Your Email</h2>

{% if error %}
    <p style="color: red;">{{ error }}</p>
{% endif %}
{% if info %}
    <p style="color: green;">{{ info }}</p>
{% endif %}

<form method="post" action="{% url 'accounts:verify_email' %}">
    {% csrf_token %}
    <label for="code">Enter the 6-digit code sent to your email:</label>
    <input type="text" name="code" id="code" maxlength="6" required>
    <button type="submit">Verify</button>
</form>

<hr>

<form method="post" action="{% url 'accounts:resend_otp' %}">
    {% csrf_token %}
    <button type="submit">Resend Code</button>
</form>
