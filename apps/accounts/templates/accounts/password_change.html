{% extends "base.html" %}
{% load static %}

{% block title %}Change Password | Panchakanya Collections{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/accounts-password-change.css' %}">
{% endblock %}

{% block content %}

<div class="pk-password-change">

    <div class="pk-password-change-card">

        <div class="pk-password-change-header">
            <h1>Change Password</h1>
            <p>Update your account password.</p>
        </div>

        <form method="post" class="pk-password-change-form">
            {% csrf_token %}

            {{ form.as_p }}

            <div class="pk-password-change-actions">
                <button type="submit">
                    Change Password
                </button>

                <a href="{% url 'dashboard:profile' %}">
                    Cancel
                </a>
            </div>
        </form>

    </div>

</div>

{% endblock %}
