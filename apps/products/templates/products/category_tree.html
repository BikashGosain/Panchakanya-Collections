{% for category in categories %}

    <li class="category-item">

        <div class="category-row">

            <a
                href="?category={{ category.slug }}"
                class="category-link
                {% if category.slug == selected_category %}
                    selected
                {% endif %}"
            >
                {{ category.name }}
            </a>


            {% if category.has_children %}

                <button
                    type="button"
                    class="category-toggle"
                    onclick="toggleCategory('category-{{ category.id }}')"
                    aria-label="Toggle {{ category.name }}"
                >

                    <span
                        id="icon-category-{{ category.id }}"
                    >
                        {% if category.slug in expanded_category_slugs %}
                            ▼
                        {% else %}
                            ▶
                        {% endif %}
                    </span>

                </button>

            {% endif %}

        </div>


        {% if category.has_children %}

            <ul
                id="category-{{ category.id }}"
                class="subcategory-list"
                style="
                    display:
                    {% if category.slug in expanded_category_slugs %}
                        block
                    {% else %}
                        none
                    {% endif %};
                "
            >

                {% include "products/category_tree.html" with categories=category.subcategories.all %}

            </ul>

        {% endif %}

    </li>

{% endfor %}
