[project]
name = "panchakanya-collections"
version = "0.1.0"
description = "Panchakanya Collections — jewelry store web app"
authors = [
    { name = "Bikash Gosain", email = "bikashgosain@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=6.1",
    "django-allauth>=65.19.1",
    "pillow>=12.3.0",
    "pyjwt>=2.13.0",
    "python-decouple>=3.8",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.3",
]
[tool.ruff]
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
ignore = ["RUF012"]
